services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: news-crawler-backend
        working_dir: /var/www/html
        volumes:
            - ./backend:/var/www/html
        ports:
            - "8000:8000"
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_CONNECTION: pgsql
            DB_HOST: database
            DB_PORT: 5432
            DB_DATABASE: news_crawler
            DB_USERNAME: crawler
            DB_PASSWORD: crawler_password
        depends_on:
            database:
                condition: service_healthy
        command: >
            sh -c "composer install &&
            php artisan serve --host=0.0.0.0 --port=8000"

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: news-crawler-frontend
        working_dir: /app
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        ports:
            - "5173:5173"
        command: >
            sh -c "npm install &&
            npm run dev -- --host 0.0.0.0"

    database:
        image: postgres:16-alpine
        container_name: news-crawler-database
        environment:
            POSTGRES_DB: news_crawler
            POSTGRES_USER: crawler
            POSTGRES_PASSWORD: crawler_password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U crawler -d news_crawler"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
    frontend_node_modules:
