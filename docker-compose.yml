services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: news-crawler-backend
        working_dir: /var/www/html
        volumes:
            - ./backend:/var/www/html
            - backend_vendor:/var/www/html/vendor
            - frontend_dist:/var/www/html/public/frontend:ro
        ports:
            - "8000:8000"
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_CONNECTION: pgsql
            DB_HOST: database
            DB_PORT: 5432
            DB_DATABASE: news_crawler
            DB_USERNAME: crawler
            DB_PASSWORD: crawler_password
        depends_on:
            database:
                condition: service_healthy
            frontend:
                condition: service_completed_successfully
        command: >
            sh -c "
            if [ ! -f vendor/autoload.php ]; then
                composer install --no-interaction;
            fi &&
            php artisan serve --host=0.0.0.0 --port=8000
            "
        restart: unless-stopped

    frontend:
        image: node:22-alpine
        container_name: news-crawler-frontend
        working_dir: /app
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
            - frontend_dist:/app/dist
        command: >
            sh -c "npm install &&
            npm run build"
        restart: "no"

    database:
        image: postgres:16-alpine
        container_name: news-crawler-database
        environment:
            POSTGRES_DB: news_crawler
            POSTGRES_USER: crawler
            POSTGRES_PASSWORD: crawler_password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U crawler -d news_crawler"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    postgres_data:
    backend_vendor:
    frontend_dist:
    frontend_node_modules:
